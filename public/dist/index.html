    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/worker.js', { type: 'module' })
          .then((registration) => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch((err) => {
            console.log('Service Worker registration failed:', err);
          });
      }
    </script>
