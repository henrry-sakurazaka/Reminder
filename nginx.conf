events {
    worker_connections 1024;
}

http {
    upstream app2 {
        server app2:3000;  # Docker内のappサービス（内部のコンテナ間通信）
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://app2; # upstreamに向ける
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


    server {
        listen 443 ssl;
        server_name localhost;

        # ssl_certificate /etc/nginx/ssl/server.crt;  # ローカルでのSSL証明書設定
        # ssl_certificate_key /etc/nginx/ssl/server.key;  # ローカルでのSSL証明書秘密鍵設定

        ssl_certificate /etc/ssl/certs/server.cert.pem;
        ssl_certificate_key /etc/ssl/private/server.key.pem;
       
        # Reactアプリへのプロキシ設定
        # location / {
        #     proxy_pass https://offsetcodecraft.com; # HTTPSにしたい場合は、app側もSSL対応させる
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_ssl_server_name on;
        #     proxy_ssl_verify off; # 必要に応じて無効化
        # }

        location / {
            proxy_pass https://eb75-240f-c7-2c6a-1-5008-edb2-f0b3-bec8.ngrok-free.app;  # ngrokのHTTPS URLにリバースプロキシ
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;  # ngrokのSSLを無効化（必要に応じて）
        }
    }
}
