events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass https://app:3000; # ローカルのReactアプリをプロキシ
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

     HTTPからHTTPSへのリダイレクト
    server {
        listen 80;
        server_name offsetcodecraft.com;
        return 301 https://$host$request_uri;
        # location /.well-known/acme-challenge/ {
        #     root /var/www/certbot;
        # }
    }

    server {
        listen 443 ssl;
        server_name offsetcodecraft.com;

        # ssl_certificate /etc/ssl/certs/server.cert.pem;
        # ssl_certificate_key /etc/ssl/private/server.key.pem;
        # ssl_certificate /etc/letsencrypt/live/offsetcodecraft.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/offsetcodecraft.com/privkey.pem;
        # ssl_certificate /etc/letsencrypt/live/offsetcodecraft.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/offsetcodecraft.com/privkey.pem;


        # Reactアプリへのプロキシ設定
        location / {
            proxy_pass https://offsetcodecraft.com; # HTTPSにしたい場合は、app側もSSL対応させる
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off; # 必要に応じて無効化
        }
    }

   
}
