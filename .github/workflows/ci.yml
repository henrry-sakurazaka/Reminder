name: CI/CD Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Create .env file
        env:
          VITE_REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          VITE_FIREBASE_EMULATOR_HOST: ${{ secrets.FIREBASE_EMULATOR_HOST }}
          VITE_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          VITE_GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          VITE_REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          VITE_REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          ITE_REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          VITE_REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          VITE_REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          VITE_REACT_APP_TEST_EMAIL: ${{ secrets.REACT_APP_TEST_EMAIL }}
          VITE_REACT_APP_TEST_PASSWORD: ${{ secrets.REACT_APP_TEST_PASSWORD }}
          VITE_NODE_ENV: ${{ secrets.NODE_ENV }}
          VITE_SERVER_CERT: ${{ secrets.SERVER_CERT }}
          VITE_SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          echo "VITE_REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "VITE_FIREBASE_EMULATOR_HOST=${{ secrets.FIREBASE_EMULATOR_HOST }}" >> .env
          echo "VITE_FIREBASE_TOKEN=${{ secrets.FIREBASE_TOKEN }}" >> .env
          echo "VITE_GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_REACT_APP_TEST_EMAIL=${{ secrets.REACT_APP_TEST_EMAIL }}" >> .env
          echo "VITE_REACT_APP_TEST_PASSWORD=${{ secrets.REACT_APP_TEST_PASSWORD }}" >> .env
          echo "VITE_NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
          echo "VITE_SERVER_CERT=${{ secrets.SERVER_CERT }}" > server.key.pem
          echo "VITE_SERVER_KEY=${{ secrets.SERVER_KEY }}" > server.cert.pem

      - name: Create Service Account Key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > ./serviceAccountKey.json
      
      - name: Copy Service Account Key to Functions
        run: cp ./serviceAccountKey.json ./functions/serviceAccountKey.json
   
      - name: Copy Service Account Key to Firebase
        run: cp ./serviceAccountKey.json ./firebase/serviceAccountKey.json
   
      - name: Create SSL Certificates
        run: |
          echo "${{ secrets.SERVER_CERT }}" > ../server.cert.pem
          echo "${{ secrets.SERVER_KEY }}" > ../server.key.pem
      
      - name: Build Docker image
        run: docker-compose build

      - name: Start Vite HTTPS Server
        run: npm run dev -- --https &
      
      - name: Debug app container
        run: docker-compose logs app
      
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
         
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run ESLint with auto-fix
        run: npx eslint src/ --fix

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag and Push Docker images
        run: |
          for tag in app2 app3 app4; do
            docker tag app ${{ secrets.DOCKER_USERNAME }}/app:$tag
            docker push ${{ secrets.DOCKER_USERNAME }}/app:$tag
          done
    
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30  # 30分まで延長

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Playwright
        run: npm install @playwright/test --save-dev

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Set up Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.11.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

    
      # - name: Set up test results directory
      #   run: |
      #     mkdir -p test-results
      #     chmod -R 777 test-results
        
      # - name: Set up report directory with permissions
      #   run: |
      #     mkdir -p playwright-report
      #     chmod -R 777 playwright-report    

      - name: Create .env file
        
        run: |
          echo "VITE_REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env
          echo "VITE_REACT_APP_TEST_EMAIL=${{ secrets.REACT_APP_TEST_EMAIL }}" >> .env
          echo "VITE_REACT_APP_TEST_PASSWORD=${{ secrets.REACT_APP_TEST_PASSWORD }}" >> .env
          echo "${{ secrets.SERVER_CERT }}" > server.cert.pem
          echo "${{ secrets.SERVER_KEY }}" > server.key.pem

      - name: Prepare Docker Compose
        run: docker-compose down

      - name: Run Docker Compose for app
        run: docker-compose build 

      - name: Run app and tests
        run: docker-compose up -d

      - name: Run Playwright tests
        env: 
          VITE_REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          VITE_REACT_APP_TEST_EMAIL: ${{ secrets.REACT_APP_TEST_EMAIL }}
          VITE_REACT_APP_TEST_PASSWORD: ${{ secrets.REACT_APP_TEST_PASSWORD }}
          run: npx playwright test 

      - name: Playwright Test Logs
        if: failure()
        run: cat playwright-report/output.log

      - name: Teardown
        run: docker-compose down

  deploy:
    runs-on: ubuntu-latest
    needs:
      - lint
      - e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" > /tmp/keyfile.json
          firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"


