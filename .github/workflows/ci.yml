name: CI/CD Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Clean Docker system
        run: docker system prune -a -f
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Buildx Version
        run: docker buildx version

      - name: Create .env file
        run: |
          echo "VITE_HTTPS=${{ secrets.VITE_HTTPS }}" >> .env
          echo "VITE_REACT_APP_API_URL=${{ secrets.VITE_REACT_APP_API_URL }}" >> .env
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "VITE_FIREBASE_EMULATOR_HOST=${{ secrets.FIREBASE_EMULATOR_HOST }}" >> .env
          echo "VITE_FIREBASE_TOKEN=${{ secrets.FIREBASE_TOKEN }}" >> .env
          echo "VITE_GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_REACT_APP_TEST_EMAIL=${{ secrets.VITE_REACT_APP_TEST_EMAIL }}" >> .env
          echo "VITE_REACT_APP_TEST_PASSWORD=${{ secrets.VITE_REACT_APP_TEST_PASSWORD }}" >> .env
          echo "VITE_NODE_ENV=${{ secrets.VITE_NODE_ENV }}" >> .env
          echo "VITE_HOST=${{ secrets.VITE_HOST }}" >> .env
          echo "VITE_PORT=${{ secrets.VITE_PORT }}" >> .env
          echo "VITE_PLAYWRIGHT_BASE_URL=${{ secrets.VITE_PLAYWRIGHT_BASE_URL }}" >> .env
          echo "VITE_CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.VITE_CLOUDFLARE_TUNNEL_TOKEN }}" >> .env
          echo "VITE_CLOUDFLARE_API_TOKEN=${{ secrets.VITE_CLOUDFLARE_API_TOKEN }}" >> .env
          echo "TUNNEL_ID=${{ secrets.TUNNEL_ID }}" >> .env
          echo "HOST=${{ secrets.HOST }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

          #証明書ファイルの作成
          printf -- "${{ secrets.VITE_SERVER_CERT }}" > server.cert.pem
          printf -- "${{ secrets.VITE_SERVER_KEY }}" > server.key.pem
          printf -- "${{ secrets.CF_CONFIG_YML }}" > .cloudflared/config.yml
          printf -- "${{ secrets.CF_CERT_PEM }}" > .cloudflared/cert.pem
          printf -- "${{ secrets.CF_CREDENTIALS_FILE }}" > .cloudflared/offsetcodecraft.site.json
          printf -- "${{ secrets.CF_ENTRYPOINT }}" > .cloudflared/entrypoint.sh

      # mkdir -p /home/runner/.cloudflared
      # printf -- "${{ secrets.VITE_SERVER_CERT }}" > /home/runner/.cloudflared/server.cert.pem
      # printf -- "${{ secrets.VITE_SERVER_KEY }}" > /home/runner/.cloudflared/server.key.pem
      # printf -- "${{ secrets.CF_CONFIG_YML }}" > /home/runner/.cloudflared/config.yml
      # printf -- "${{ secrets.CF_CERT_PEM }}" > /home/runner/.cloudflared/cert.pem
      # printf -- "${{ secrets.CF_CREDENTIALS_FILE }}" > /home/runner/.cloudflared/offsetcodecraft.site.json
      # printf -- "${{ secrets.CF_ENTRYPOINT }}" > /home/runner/.cloudflared/entrypoint.sh
      
      # - name: Copy Cloudflared Config to Target Directory
      #   run: |
      #     sudo mkdir -p /home/runner/.cloudflared/
      #     sudo chown -R runner:runner /home/runner/.cloudflared/
      #     sudo chmod -R 700 /home/runner/.cloudflared/

      #     cp .cloudflared/offsetcodecraft.site.json /home/runner/.cloudflared/
      #     cp .cloudflared/config.yml /home/runner/.cloudflared/
      #     cp .cloudflared/cert.pem /home/runner/.cloudflared/

      #     ls -la /home/runner/.cloudflared/
    
      # ローカル環境用設定
      # - name: Copy Cloudflared Config to Target Directory
      #   run: |
      #     sudo useradd -m -s /bin/bash nonroot
      #     sudo mkdir -p /home/nonroot/.cloudflared/
      #     cp .cloudflared/offsetcodecraft.site.json /home/nonroot/.cloudflared/
      #     cp .cloudflared/config.yml /home/nonroot/.cloudflared/
      #     cp .cloudflared/cert.pem /home/nonroot/.cloudflared/
      #     ls -la /home/nonroot/.cloudflared/

      
          # cat .env

      - name: Debug .env file
        run: cat .env

      - name: Create Service Account Key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > ./serviceAccountKey.json

      - name: Copy Service Account Key to Functions
        run: cp ./serviceAccountKey.json ./functions/serviceAccountKey.json

      - name: Copy Service Account Key to Firebase
        run: cp ./serviceAccountKey.json ./firebase/serviceAccountKey.json

      - name: Build Docker image (Compose)
        run: docker-compose build

      - name: Build Docker image (App)
        run: docker build -t app2:latest .

      - name: Start Vite HTTPS Server
        run: npm run dev -- --https &

      - name: Debug app2 container
        run: docker-compose logs app2

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run ESLint with auto-fix
        run: npx eslint src/ --fix
  
    
  E2E-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Clear Playwright cache
        run: rm -rf /home/runner/.cache/ms-playwright

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install Playwright dependencies
        run: sudo apt-get install -y libx11-dev libxcomposite-dev libxrandr-dev libasound2-dev libatk-bridge2.0-dev libgtk-3-dev

      - name: Install Playwright Test
        run: npm install --save-dev @playwright/test

      - name: Install dependencies
        run: npm install 

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.11.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      
      - name: Clear Cloudflared cache
        run: rm -rf ~/.cloudflared /tmp/cloudflared ~/.config/cloudflared
    
      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
      

      # - name: Set CLOUDFLARED_DIR in github.env
      #   run: echo "CLOUDFLARED_DIR=/home/runner/.cloudflared" >> $GITHUB_ENV

      - name: Create .env file and keys
        run: |
          echo "VITE_HTTPS=${{ secrets.VITE_HTTPS }}" >> .env
          echo "VITE_REACT_APP_API_URL=${{ secrets.VITE_REACT_APP_API_URL }}" >> .env
          echo "VITE_REACT_APP_TEST_EMAIL=${{ secrets.VITE_REACT_APP_TEST_EMAIL }}" >> .env
          echo "VITE_REACT_APP_TEST_PASSWORD=${{ secrets.VITE_REACT_APP_TEST_PASSWORD }}" >> .env
          echo "VITE_NODE_ENV=${{ secrets.VITE_NODE_ENV }}" >> .env
          echo "VITE_HOST=${{ secrets.VITE_HOST }}" >> .env
          echo "VITE_PORT=${{ secrets.VITE_PORT }}" >> .env
          echo "VITE_PLAYWRIGHT_BASE_URL=${{ secrets.VITE_PLAYWRIGHT_BASE_URL }}" >> .env
          echo "VITE_CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.VITE_CLOUDFLARE_TUNNEL_TOKEN }}" >> .env
          echo "VITE_CLOUDFLARE_API_TOKEN=${{ secrets.VITE_CLOUDFLARE_API_TOKEN }}" >> .env
          echo "TUNNEL_ID=${{ secrets.TUNNEL_ID}}" >> .env
          echo "HOST=${{ secrets.HOST }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

          # 証明書ファイルの作成
          printf -- "${{ secrets.VITE_SERVER_CERT }}" > server.cert.pem
          printf -- "${{ secrets.VITE_SERVER_KEY }}" > server.key.pem
          printf -- "${{ secrets.CF_CONFIG_YML }}" > .cloudflared/config.yml
          printf -- "${{ secrets.CF_CERT_PEM }}" > .cloudflared/cert.pem
          printf -- "${{ secrets.CF_CREDENTIALS_FILE }}" > .cloudflared/offsetcodecraft.site.json
          printf -- "${{ secrets.CF_ENTRYPOINT }}" > .cloudflared/entrypoint.sh

      - name: Define Permission
        run: |
          chmod +x .cloudflared/entrypoint.sh
          chmod 600 .cloudflared/config.yml

      - name: Define Directory
        run: |
          mkdir -p /home/runner/.cloudflared
          printf -- "${{ secrets.VITE_SERVER_CERT }}" > /home/runner/.cloudflared/server.cert.pem
          printf -- "${{ secrets.VITE_SERVER_KEY }}" > /home/runner/.cloudflared/server.key.pem
          printf -- "${{ secrets.CF_CONFIG_YML }}" > /home/runner/.cloudflared/config.yml
          printf -- "${{ secrets.CF_CERT_PEM }}" > /home/runner/.cloudflared/cert.pem
          printf -- "${{ secrets.CF_CREDENTIALS_FILE }}" > /home/runner/.cloudflared/offsetcodecraft.site.json
          printf -- "${{ secrets.CF_ENTRYPOINT }}" > /home/runner/.cloudflared/entrypoint.sh

      - name: Copy Cloudflared Config to Target Directory
        run: |
          sudo mkdir -p /home/runner/.cloudflared/
          sudo chown -R runner:runner /home/runner/.cloudflared/
          sudo chmod -R 700 /home/runner/.cloudflared/
          cp .cloudflared/offsetcodecraft.site.json /home/runner/.cloudflared/
          cp .cloudflared/config.yml /home/runner/.cloudflared/
          cp .cloudflared/cert.pem /home/runner/.cloudflared/

          ls -la /home/runner/.cloudflared/
     
          cat .env


      # ローカル環境用設定
      # - name: Copy Cloudflared Config to Target Directory
      #   run: |
      #     sudo useradd -m -s /bin/bash nonroot
      #     sudo mkdir -p /home/nonroot/.cloudflared/
      #     sudo chown -R nonroot:nonroot /home/nonroot/.cloudflared
      #     sudo chmod -R 755 /home/nonroot/  
      #     sudo chmod -R 700 /home/nonroot/.cloudflared
      #     cp .cloudflared/offsetcodecraft.site.json /home/nonroot/.cloudflared/
      #     cp .cloudflared/config.yml /home/nonroot/.cloudflared/
      #     cp .cloudflared/cert.pem /home/nonroot/.cloudflared/
      #     ls -la /home/nonroot/.cloudflared/

      # - name: Build Docker image (App)
      #   run: docker build -t app2:latest .
      #   env:
      #     VITE_HTTPS: ${{ secrets.VITE_HTTPS }}
      #     VITE_REACT_APP_API_URL: ${{ secrets.VITE_REACT_APP_API_URL }}
      #     VITE_REACT_APP_TEST_EMAIL: ${{ secrets.VITE_REACT_APP_TEST_EMAIL }}
      #     VITE_REACT_APP_TEST_PASSWORD: ${{ secrets.VITE_REACT_APP_TEST_PASSWORD }}
      #     VITE_NODE_ENV: ${{ secrets.VITE_NODE_ENV }}
      #     VITE_HOST: ${{ secrets.VITE_HOST }}
      #     VITE_PORT: ${{ secrets.VITE_PORT }}
      #     VITE_PLAYWRIGHT_BASE_URL: ${{ secrets.VITE_PLAYWRIGHT_BASE_URL }}
      #     VITE_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.VITE_CLOUDFLARE_TUNNEL_TOKEN }}
      #     VITE_CLOUDFLARE_API_TOKEN: ${{ secrets.VITE_CLOUDFLARE_API_TOKEN }}
      #     TUNNEL_ID: ${{ secrets.TUNNEL_ID }}
      #     HOST: ${{ secrets.HOST }}
      #     PORT: ${{ secrets.PORT }}
          


      - name: Add Permission
        run: |
          chmod 640 .cloudflared/offsetcodecraft.site.json

      - name: Set up Cloudflare API token
        run: echo "VITE_CLOUDFLARE_API_TOKEN=${{ secrets.VITE_CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV

        # UDP Buffer Sizeを増加
      - name: Increase UDP Buffer Size
        run: |
          sudo sysctl -w net.core.rmem_max=8388608
          sudo sysctl -w net.core.wmem_max=8388608

      # ping_group_rangeの設定
      - name: Adjust ping_group_range
        run: |
          echo "1 2147483647" | sudo tee /proc/sys/net/ipv4/ping_group_range
          echo "net.ipv4.ping_group_range=1 2147483647" | sudo tee -a /etc/sysctl.conf
      
      - name: Build App
        run: |
          docker-compose down --volumes
          docker system prune -f
          docker-compose build

      - name: Create Docker network
        run: | 
          docker network create test-network2

      - name: Define Permission2
        run: | 
          chmod +x /home/runner/.cloudflared/entrypoint.sh

      # - name: Start Cloudflare Tunnel
      #   run: | 
      #     nohup cloudflared tunnel run --token $VITE_CLOUDFLARE_TUNNEL_TOKEN > cloudflared.log 2>&1 &
      #   env:
      #     VITE_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.VITE_CLOUDFLARE_TUNNEL_TOKEN }}
      
      - name: Start App
        run: |
          docker-compose up -d cloudflared

      - name: Check Permission
        run: |
          docker exec -i cloudflared ls -l /home/runner/.cloudflared/

      - name: Show Logs
        run: docker-compose logs cloudflared

      - name: Setting Tunnel url
        run: docker exec -i cloudflared cloudflared tunnel --url localhost:3000 &

      # - name: Tunnel start
      #   run: docker exec -i cloudflared cloudflared tunnel run offsetcodecraft.site &
        
      - name: Check Cloudflare Tunnel
        run: |
          curl -I https://offsetcodecraft.site
  
      - name: Start App
        run: docker-compose up -d

      - name: Wait for containers to be fully started
        run: |
          sleep 10  

      - name: Connect reminder-playwright-1 to test-network2
        run: |
          if ! docker network inspect test-network2 | grep -q "reminder-playwright-1"; then
            docker network connect test-network2 reminder-playwright-1
          else
            echo "Container is already connected to the network."
          fi

      - name: Connect reminder-app2-1 to test-network2
        run: |
          if ! docker network inspect test-network2 | grep -q "reminder-app2-1"; then
            docker network connect test-network2 reminder-app2-1
          else
            echo "Container is already connected to the network."
          fi

      - name: Connect reminder-firebase-1 to test-network2
        run: |
          if ! docker network inspect test-network2 | grep -q "reminder-firebase-1"; then
            docker network connect test-network2 reminder-firebase-1
          else
            echo "Container is already connected to the network."
          fi

      - name: Check responsed URL
        run: |
          docker exec reminder-playwright-1 curl http://172.18.0.3:3000
          docker exec reminder-playwright-1 ps aux | grep node

      - name: Set permissions for test-results directory
        run: |
          sudo chmod 777 server.key.pem
          sudo chmod 777 server.cert.pem
          sudo chown root:root server.key.pem
          sudo chown root:root server.cert.pem
          sudo mkdir -p $GITHUB_WORKSPACE/playwright-test-results
          sudo chmod -R 777 $GITHUB_WORKSPACE/playwright-test-results
          sudo mkdir -p $GITHUB_WORKSPACE/test-results
          sudo chmod -R 777 $GITHUB_WORKSPACE/test-results
          mkdir -p ./test-results
          chmod -R 777 ./test-results

          # test-resultsディレクトリに書き込みできるか確認
          ls -l $GITHUB_WORKSPACE/test-results

      - name: Debug .env file contents
        run: cat .env

      - name: Run E2E Tests
        run: |
          npx playwright test ./tests --workers=1
          DEBUG=pw:api npx playwright test

      - name: Run Playwright Tests
        run: |
          npx playwright test --reporter=html

      - name: Playwright Test Logs
        if: failure()
        run: cat playwright-report/output.log

      - name: Teardown
        run: docker-compose down

      
  deploy:
    runs-on: ubuntu-latest
    needs:
      - lint
      - E2E-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up Firebase credentials
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" > /tmp/keyfile.json
          export GOOGLE_APPLICATION_CREDENTIALS="/tmp/keyfile.json"

      - name: Deploy to Firebase
        run: |
          firebase deploy --only functions --project "${{ secrets.FIREBASE_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"
          firebase deploy --only hosting --project "${{ secrets.FIREBASE_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"











