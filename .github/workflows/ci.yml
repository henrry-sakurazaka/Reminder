name: CI/CD Workflow

on:
  push:
    branches:
      - originMaster2
  pull_request:
    branches:
      - originMaster2

jobs:      
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run ESLint with auto-fix
        run: npx eslint src/ --fix
  
    
  E2E-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Clear Playwright cache
        run: rm -rf /home/nonroot/.cache/ms-playwright

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install Playwright dependencies
        run: sudo apt-get install -y libx11-dev libxcomposite-dev libxrandr-dev libasound2-dev libatk-bridge2.0-dev libgtk-3-dev

      - name: Install Playwright Test
        run: npm install --save-dev @playwright/test

      - name: Install dependencies
        run: npm install 

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.11.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      
      - name: Clear Cloudflared cache
        run: rm -rf ~/.cloudflared /tmp/cloudflared ~/.config/cloudflared
    
     
      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version  
       
      - name: Create .env file and keys
        run: |
          echo "VITE_HTTPS=${{ secrets.VITE_HTTPS }}" >> .env
          echo "VITE_REACT_APP_API_URL=${{ secrets.VITE_REACT_APP_API_URL }}" >> .env
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "VITE_REACT_APP_VAPID_KEY=${{ secrets.VITE_REACT_APP_VAPID_KEY }}" >> .env
          echo "VITE_FIREBASE_EMULATOR_HOST=${{ secrets.FIREBASE_EMULATOR_HOST }}" >> .env
          echo "VITE_FIREBASE_TOKEN=${{ secrets.VITE_FIREBASE_TOKEN }}" >> .env
          echo "VITE_REACT_APP_VAPID_KEY=${{ secrets.VITE_REACT_APP_VAPID_KEY}}" >> .env
          echo "VITE_GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.VITE_GOOGLE_APPLICATION_CREDENTIALS }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_API_KEY=${{ secrets.VITE_REACT_APP_FIREBASE_API_KEY }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_APP_ID=${{ secrets.VITE_GOOGLE_APPLICATION_CREDENTIALSREACT_APP_FIREBASE_APP_ID }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_REACT_APP_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_DATABASE_URL=${{ secrets.VITE_REACT_APP_FIREBASE_DATABASE_URL }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.VITE_REACT_APP_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_REACT_APP_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_REACT_APP_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_REACT_APP_TEST_EMAIL=${{ secrets.VITE_REACT_APP_TEST_EMAIL }}" >> .env
          echo "VITE_REACT_APP_TEST2_EMAIL=${{ secrets.VITE_REACT_APP_TEST2_EMAIL }}" >> .env
          echo "VITE_REACT_APP_TEST_PASSWORD=${{ secrets.VITE_REACT_APP_TEST_PASSWORD }}" >> .env
          echo "VITE_REACT_APP_TES2_PASSWORD=${{ secrets.VITE_REACT_APP_TEST2_PASSWORD }}" >> .env
          echo "VITE_NODE_ENV=${{ secrets.VITE_NODE_ENV }}" >> .env
          echo "VITE_HOST=${{ secrets.VITE_HOST }}" >> .env
          echo "VITE_PORT=${{ secrets.VITE_PORT }}" >> .env
          echo "VITE_PLAYWRIGHT_BASE_URL=${{ secrets.VITE_PLAYWRIGHT_BASE_URL }}" >> .env
          echo "VITE_CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.VITE_CLOUDFLARE_TUNNEL_TOKEN }}" >> .env
          echo "VITE_CLOUDFLARE_API_TOKEN=${{ secrets.VITE_CLOUDFLARE_API_TOKEN }}" >> .env
          echo "TUNNEL_ID=${{ secrets.TUNNEL_ID }}" >> .env
          echo "HOST=${{ secrets.HOST }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

          # 証明書ファイルの作成
          printf -- "${{ secrets.VITE_SERVER_CERT }}" > server.cert.pem
          printf -- "${{ secrets.VITE_SERVER_KEY }}" > server.key.pem
          printf -- "${{ secrets.CF_CONFIG_YML }}" > .cloudflared/config.yml
          printf -- "${{ secrets.CF_CERT_PEM }}" > .cloudflared/cert.pem


      - name: Load environment variables from .env
        run: |
          source .env
          echo "Firebase API Key is $VITE_REACT_APP_FIREBASE_API_KEY"
          
      - name: Create Service Account Key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > ./serviceAccountKey.json

      - name: Copy Service Account Key to Functions
        run: cp ./serviceAccountKey.json ./functions/serviceAccountKey.json

      - name: Copy Service Account Key to Firebase
        run: cp ./serviceAccountKey.json ./firebase/serviceAccountKey.json

      - name: Create nonroot user
        run: |
          sudo useradd -m nonroot
          sudo chown -R nonroot:nonroot /home/nonroot
          sudo chmod 755 /home/nonroot

      
      - name: Set up Cloudflared credentials
        run: |
          echo "${{ secrets.CF_CREDENTIALS_FILE }}" | base64 --decode | sudo tee .cloudflared/offsetcodecraft.site.json > /dev/null
          sudo chown nonroot:nonroot .cloudflared/offsetcodecraft.site.json
          sudo chmod 644 .cloudflared/offsetcodecraft.site.json  
          sudo ls -la .cloudflared/
          
      - name: Set up Cloudflared credentials2
        run: |
          sudo -u nonroot mkdir -p /home/nonroot/.cloudflared
          echo "${{ secrets.CF_CREDENTIALS_FILE }}" | base64 --decode | sudo tee /home/nonroot/.cloudflared/offsetcodecraft.site.json > /dev/null
          sudo chown nonroot:nonroot /home/nonroot/.cloudflared/offsetcodecraft.site.json
          sudo chmod 755 /home/nonroot/.cloudflared
          sudo chmod 644 /home/nonroot/.cloudflared/offsetcodecraft.site.json  
          sudo ls -la /home/nonroot/.cloudflared/
          
      
      - name: Debug JSON file content
        run: sudo cat /home/nonroot/.cloudflared/offsetcodecraft.site.json
    
     
      - name: Define Permission
        run: |
          chmod u+rx .cloudflared/entrypoint.sh
          chmod 600 .cloudflared/config.yml

      - name: Fix Permissions for Cloudflared Credentials
        run: |
          sudo chown nonroot:nonroot /home/nonroot/.cloudflared/offsetcodecraft.site.json
          sudo chmod 666 /home/nonroot/.cloudflared/offsetcodecraft.site.json
          sudo ls -la /home/nonroot/.cloudflared/
      
      - name: Setup cloudflared directory
        run: |
          sudo -u nonroot mkdir -p /home/nonroot/.cloudflared
          sudo chmod -R 777 /home/nonroot/.cloudflared
          sudo -u nonroot touch /home/nonroot/.cloudflared/config.yml

      - name: Define Directory
        run: |
          printf -- "${{ secrets.VITE_SERVER_CERT }}" > /home/nonroot/.cloudflared/server.cert.pem
          printf -- "${{ secrets.VITE_SERVER_KEY }}" > /home/nonroot/.cloudflared/server.key.pem
          printf -- "${{ secrets.CF_CONFIG_YML }}" > /home/nonroot/.cloudflared/config.yml
          printf -- "${{ secrets.CF_CERT_PEM }}" > /home/nonroot/.cloudflared/cert.pem
       
      - name: Copy Cloudflared Config to Target Directory
        run: |
          if ! id -u nonroot &>/dev/null; then
          sudo useradd -m -s /bin/bash nonroot
          fi
          sudo -u nonroot mkdir -p /home/nonroot/.cloudflared
          sudo chown -R nonroot:nonroot /home/nonroot/.cloudflared
          sudo chmod -R 777 /home/nonroot/.cloudflared  
          sudo chmod 777 /home/nonroot
          sudo chmod 666 .cloudflared/offsetcodecraft.site.json

          sudo cp .cloudflared/entrypoint.sh /home/nonroot/.cloudflared/entrypoint.sh
          sudo cp .cloudflared/config.yml /home/nonroot/.cloudflared/config.yml
          sudo cp .cloudflared/cert.pem /home/nonroot/.cloudflared/cert.pem
          sudo cp .cloudflared/offsetcodecraft.site.json /home/nonroot/.cloudflared/offsetcodecraft.site.json
          sudo ls -la /home/nonroot/.cloudflared/

      
      - name: Set up Cloudflare API token
        run: echo "VITE_CLOUDFLARE_API_TOKEN=${{ secrets.VITE_CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV

        # UDP Buffer Sizeを増加
      - name: Increase UDP Buffer Size
        run: |
          sudo sysctl -w net.core.rmem_max=8388608
          sudo sysctl -w net.core.wmem_max=8388608

      # ping_group_rangeの設定
      - name: Adjust ping_group_range
        run: |
          echo "1 2147483647" | sudo tee /proc/sys/net/ipv4/ping_group_range
          echo "net.ipv4.ping_group_range=1 2147483647" | sudo tee -a /etc/sysctl.conf
      
      - name: Build App
        run: |
          docker-compose down --volumes
          docker system prune -f
          docker-compose build

      - name: Create Docker network
        run: | 
          docker network create test-network2
          
      - name: Change ownership of entrypoint.sh
        run: |
          sudo chown nonroot:nonroot /home/nonroot/.cloudflared/entrypoint.sh
          sudo chmod +x /home/nonroot/.cloudflared/entrypoint.sh
      
      - name: Run commands as nonroot user
        run: |
          sudo -u nonroot whoami
          sudo -u nonroot ls -la /home/nonroot/.cloudflared/
          sudo -u nonroot ls -la /home/nonroot/.cloudflared/entrypoint.sh

  
      - name: Start App
        run: |
          docker-compose up -d cloudflared


      - name: Show Logs   
        run: docker logs cloudflared 
  

      - name: Inspect could access
        run: |
          docker exec cloudflared curl -I http://app2:3000 &


      - name: Check Cloudflare Tunnel
        run: |
          curl -I https://offsetcodecraft.site


      - name: Check Cloudflared Tunnel Info
        run: |
          docker exec cloudflared cloudflared tunnel info offsetcodecraft.site || docker logs cloudflared

      
      - name: Debug Cloudflared Credentials Inside Container
        run: |
          docker exec cloudflared ls -la /home/nonroot/.cloudflared/
          docker exec cloudflared cat /home/nonroot/.cloudflared/offsetcodecraft.site.json
      

      - name: Start Apps
        run: |
          docker-compose up -d 


      - name: Show Logs   
        run: docker logs cloudflared 


      - name: Wait for containers to be fully started
        run: |
          sleep 10  


      - name: Connect reminder-playwright-1 to test-network2
        run: |
          if ! docker network inspect test-network2 | grep -q "reminder-playwright-1"; then
            docker network connect test-network2 reminder-playwright-1
          else
            echo "Container is already connected to the network."
          fi


      - name: Connect reminder-app2-1 to test-network2
        run: |
          if ! docker network inspect test-network2 | grep -q "reminder-app2-1"; then
            docker network connect test-network2 app2
          else
            echo "Container is already connected to the network."
          fi


      - name: Connect reminder-firebase-1 to test-network2
        run: |
          if ! docker network inspect test-network2 | grep -q "reminder-firebase-1"; then
            docker network connect test-network2 reminder-firebase-1
          else
            echo "Container is already connected to the network."
          fi


      - name: Check responsed URL
        run: |
          docker exec reminder-playwright-1 curl http://172.18.0.3:3000
          docker exec reminder-playwright-1 ps aux | grep node


      - name: Set permissions for test-results directory
        run: |
          sudo chmod 777 server.key.pem
          sudo chmod 777 server.cert.pem
          sudo chown root:root server.key.pem
          sudo chown root:root server.cert.pem
          sudo mkdir -p $GITHUB_WORKSPACE/playwright-test-results
          sudo chmod -R 777 $GITHUB_WORKSPACE/playwright-test-results
          sudo mkdir -p $GITHUB_WORKSPACE/test-results
          sudo chmod -R 777 $GITHUB_WORKSPACE/test-results
          mkdir -p ./test-results
          chmod -R 777 ./test-results

          # test-resultsディレクトリに書き込みできるか確認
          ls -l $GITHUB_WORKSPACE/test-results

      - name: Debug .env file contents
        run: cat .env

      - name: Run E2E Tests
        run: |
          npx playwright test ./tests --workers=1
          DEBUG=pw:api npx playwright test

      - name: Run Playwright Tests
        run: |
          npx playwright test --reporter=html

      - name: Playwright Test Logs
        if: failure()
        run: cat playwright-report/output.log

      - name: Teardown
        run: docker-compose down

      
  deploy:
    runs-on: ubuntu-latest
    needs:
      - lint
      - E2E-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up Firebase credentials
        run: |
          echo "${{ secrets.VITE_GOOGLE_APPLICATION_CREDENTIALS }}" > /tmp/keyfile.json
          export VITE_GOOGLE_APPLICATION_CREDENTIALS="/tmp/keyfile.json"

      - name: Deploy to Firebase
        run: |
          firebase deploy --only functions --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --token "${{ secrets.VITE_FIREBASE_TOKEN }}"
          firebase deploy --only hosting --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --token "${{ secrets.VITE_FIREBASE_TOKEN }}"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          - name: Log in to Docker Hub
          if: github.event_name == 'push'
          run: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker tag reminder-app2 henrry301/reminder:1
            docker tag reminder-firebase henrry301/reminder:2
            docker tag mcr.microsoft.com/playwright henrry301/playwright:v1.49.0-jammy
            docker tag cloudflare/cloudflared henrry301/reminder:3
            docker push henrry301/reminder:1
            docker push henrry301/reminder:2
            docker push henrry301/reminder:3
            docker push henrry301/playwright:v1.49.0-jammy

      #deployジョブにDockr Hubへのプッシュを自動化。
  








