name: Prettier Check

on:
  pull_request:
    branches:
      - originMaster2 

jobs:
  prettier:
    name: Run Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run Prettier
        run: npm run prettier -- --check
