services:
  app2:
    container_name: app2
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    # expose: 
    #   - "3000"
    ports:
      - "3000:3000"
    networks:
      - test-network2
    volumes:
      - .:/app2
      - /app2/node_modules # 監視対象から除外
      - /app2/dist # 監視対象から除外
      # - ./server.key.pem:/etc/ssl/private/server.key.pem
      # - ./server.cert.pem:/etc/ssl/certs/server.cert.pem
      - /Users/Tsp33786/Desktop/trial_html/MY_WEB_SIGHT/reminder/test-results:/app2/test-results
    entrypoint: ./entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -k -v http://localhost:3000 || exit 1"]
      interval: 90s
      timeout: 60s
      retries: 5
      start_period: 60s
    environment: 
      VITE_NODE_ENV: ${VITE_NODE_ENV}
      VITE_HTTPS: "true"
      command: vite --https
      VITE_PORT: ${VITE_PORT}
      VITE_HOST: ${VITE_HOST}
      HOST: 0.0.0.0
    depends_on:
      - firebase
   
  firebase:
    build:
      context: .
      dockerfile: ./firebase/Dockerfile
    env_file:
      - .env
    environment:
      VITE_GOOGLE_APPLICATION_CREDENTIALS: "/firebase/serviceAccountKey.json"
    ports:
      - "8080:8080"
      - "5001:5001"
      - "5000:5000"
      - "8090:8090"
      - "9199:9199"
      - "8091:8091"
      - "8085:8085"
    entrypoint: ["/bin/bash", "/firebase/entrypoint.sh"]
    command: firebase emulators:start --only firestore,functions,auth,storage
    volumes:
      - ./storage.rules:/firebase/storage.rules 
    networks:
      - test-network2
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    user: root
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: ./.cloudflared/Dockerfile
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      app2:
        condition: service_healthy
      # nginx: 
      #   condition: service_healthy
    env_file:
      - .env
    # entrypoint: ["/bin/bash", "-c", "chmod +x entrypoint.sh && ./entrypoint.sh"]
    # entrypoint: ["/home/nonroot/.cloudflared/entrypoint.sh"]
    entrypoint: ["/bin/bash", "-c", "/home/runner/.cloudflared/entrypoint.sh"]
    volumes:
      - ~/.cloudflared:/home/runner/.cloudflared
      - ~/.cloudflared/cert.pem:/home/runner/.cloudflared/cert.pem:ro
      - ~/.cloudflared/offsetcodecraft.site.json:/home/runner/.cloudflared/offsetcodecraft.site.json:ro
      # - ~/.cloudflared:/home/nonroot/.cloudflared
      # - ~/.cloudflared/cert.pem:/home/nonroot/.cloudflared/cert.pem:ro
      # - ~/.cloudflared/offsetcodecraft.site.json:/home/nonroot/.cloudflared/offsetcodecraft.site.json:ro
      # - ~/.cloudflared:/home/nonroot/.cloudflared
      # - /tmp/cloudflared/.cloudflared:/home/nonroot/.cloudflared
      # - ~/cloudflared-config:/home/nonroot/.cloudflared
      # - ./.cloudflared/offsetcodecraft.site.json:/home/nonroot/.cloudflared/offsetcodecraft.site.json:ro
      # - /Users/Tsp33786/.cloudflared/cert.pem:/home/nonroot/.cloudflared/cert.pem
      # - /Users/Tsp33786/.cloudflared/offsetcodecraft.site.json:/home/nonroot/.cloudflared/offsetcodecraft.site.json
      # - /Users/Tsp33786/Desktop/trial_html/MY_WEB_SIGHT/reminder/.cloudflared:/home/nonroot/.cloudflared
    environment:
      - CLOUDFLARE_API_TOKEN=${VITE_CLOUDFLARE_API_TOKEN}  
      - TUNNEL_ORIGIN_CERT=/home/runner/.cloudflared/cert.pem
      # - TUNNEL_ORIGIN_CERT=/home/nonroot/.cloudflared/cert.pem
      - TUNNEL_ID=${TUNNEL_ID}
      - VITE_CLOUDFLARE_TUNNEL_TOKEN=${VITE_CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    command: tunnel run --token ${VITE_CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      # disable: true
      test: ["CMD", "curl", "-f", "https://offsetcodecraft.site", "||", "exit", "1"]
      interval: 90s
      timeout: 60s
      retries: 5
      start_period: 60s
    networks:
      - test-network2
   
  
