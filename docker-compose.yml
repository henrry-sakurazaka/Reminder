
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Reactアプリのポート
    volumes:
      - .:/app  
    env_file:
      - .env
    entrypoint: ./entrypoint.sh /entrypoint.sh # entrypoint.shを使う
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "https://app:3000"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 30s

  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/nginx/nginx.conf  # Nginx設定ファイルをマウント
      - ./server.cert:/Users/Tsp33786/Desktop/trial html/MY_WEB_SIGHT/reminder/server.cert  # 証明書をマウント
      - ./server.key:/Users/Tsp33786/Desktop/trial html/MY_WEB_SIGHT/reminder/server.key
    # キーをマウント
    depends_on:
      - app  # appが起動してからnginxが起動

  firebase:
    build:
      context: .  
      dockerfile: ./firebase/Dockerfile  
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS="app/serviceAccountKey.json"
    ports:
      - "8080:8080"
      - "5001:5001"
      - "5000:5000"
      - "9000:9000"
    entrypoint: ["/bin/bash", "/firebase/entrypoint.sh"]
    command: firebase emulators:start --only firestore,functions  # Firebaseエミュレーターを起動するコマンド

  playwright:
    image: mcr.microsoft.com/playwright:v1.48.1-focal
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_TEST_EMAIL=${REACT_APP_TEST_EMAIL}
      - REACT_APP_TEST_PASSWORD=${REACT_APP_TEST_PASSWORD}
      - REACT_APP_TEST2_EMAIL=${REACT_APP_TEST2_EMAIL}
      - REACT_APP_TEST2_PASSWORD=${REACT_APP_TEST2_PASSWORD}
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
    
      - app
      # app:
      #   condition: service_healthy
    command: npx playwright test
 