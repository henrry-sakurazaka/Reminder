services:
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    expose:
      - "3000"
    networks:
      - test-network
    volumes:
      - .:/app2
      - /app2/node_modules # 監視対象から除外
      - /app2/dist # 監視対象から除外
      - ./server.key.pem:/etc/ssl/private/server.key.pem
      - ./server.cert.pem:/etc/ssl/certs/server.cert.pem
    entrypoint: ./entrypoint.sh
    healthcheck:
      # test: ["CMD-SHELL", "curl -k -v https://eb75-240f-c7-2c6a-1-5008-edb2-f0b3-bec8.ngrok-free.app2 || exit 1"]
      test: ["CMD-SHELL", "curl -k -v $NGROK_URL || exit 1"]
      interval: 90s
      timeout: 60s
      retries: 5
      start_period: 1200s
    environment:
      VITE_NGROK_AUTH_TOKEN: ${VITE_NGROK_AUTH_TOKEN}
      NGROK_URL: ${NGROK_URL}  
      VITE_NODE_ENV: ${VITE_NODE_ENV}
      VITE_REACT_APP_API_URL: ${VITE_REACT_APP_API_URL}
      VITE_HTTPS: "true"
      command: vite --https
      VITE_HOST: 0.0.0.0 
    command: |
      echo "VITE_NGROK_AUTH_TOKEN=${VITE_NGROK_AUTH_TOKEN}" && ngrok config add-authtoken $VITE_NGROK_AUTH_TOKEN
    depends_on:
      - firebase
   
  firebase:
    build:
      context: .
      dockerfile: ./firebase/Dockerfile
    env_file:
      - .env
    environment:
      VITE_GOOGLE_APPLICATION_CREDENTIALS: "/firebase/serviceAccountKey.json"
    ports:
      - "8080:8080"
      - "5001:5001"
      - "5000:5000"
      - "8090:8090"
      - "9199:9199"
      - "8091:8091"
      - "8085:8085"
    entrypoint: ["/bin/bash", "/firebase/entrypoint.sh"]
    command: firebase emulators:start --only firestore,functions,auth,storage
    volumes:
      - ./storage.rules:/firebase/storage.rules # ファイルの場合
    networks:
      - test-network
   
  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - app2 
      - ngrok
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./server.cert.pem:/etc/ssl/certs/server.cert.pem
      - ./server.key.pem:/etc/ssl/private/server.key.pem
      - ./ssl:/etc/nginx/ssl:ro
       - ./app2
    networks:
      - test-network
    env_file:
      - .env

  ngrok:
    image: ngrok/ngrok:latest
    # command: ngrok http 3000
    build:
      context: .
      dockerfile: Dockerfile.ngrok
    command: sh -c "ngrok http 3000 & sleep 5 && export NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url') && echo $NGROK_URL"
    depends_on:
      app2:
        condition: service_healthy
    environment:
      VITE_NGROK_AUTH_TOKEN: ${VITE_NGROK_AUTH_TOKEN}
    ports:
      - "4041:4040"
    network_mode: bridge
    # entrypoint: ["sh", "-c", "ngrok http 3000 & sleep 5 && export NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url') && echo $NGROK_URL"]
    entrypoint: ["./entrypoint.sh"]

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.0-jammy   
    depends_on:
      app2:
        condition: service_healthy
    networks:
      - test-network
    working_dir: /app2
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./tests:/app2/tests
      - ./package.json:/app2/package.json
      - ./node_modules:/app2/node_modules
    environment:
      - NGROK_URL=${NGROK_URL} 
    command: npx playwright test

networks:
  test-network:
    driver: bridge

