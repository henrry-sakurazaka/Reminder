services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "3000:3000" 
    networks:
      - test-network
    volumes:
      - .:/app
      - /app/node_modules # 監視対象から除外
      - /app/dist # 監視対象から除外
      # - ./server.key.pem:/etc/ssl/private/server.key.pem
      # - ./server.cert.pem:/etc/ssl/certs/server.cert.pem
    env_file:
      - .env
    entrypoint: ./entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -k -v https://eb75-240f-c7-2c6a-1-5008-edb2-f0b3-bec8.ngrok-free.app || exit 1"]
      interval: 90s
      timeout: 60s
      retries: 5
      start_period: 1200s
    environment:
      VITE_NODE_ENV: ${VITE_NODE_ENV}
      VITE_REACT_APP_API_URL: ${VITE_REACT_APP_API_URL}
      VITE_HTTPS: "true"
      command: vite --https
      VITE_HOST: 0.0.0.0
    depends_on:
      - firebase
   
  firebase:
    build:
      context: .
      dockerfile: ./firebase/Dockerfile
    env_file:
      - .env
    environment:
      VITE_GOOGLE_APPLICATION_CREDENTIALS: "/firebase/serviceAccountKey.json"
    ports:
      - "8080:8080"
      - "5001:5001"
      - "5000:5000"
      - "8090:8090"
      - "9199:9199"
      - "8091:8091"
      - "8085:8085"
    entrypoint: ["/bin/bash", "/firebase/entrypoint.sh"]
    command: firebase emulators:start --only firestore,functions,auth,storage
    volumes:
      - ./storage.rules:/firebase/storage.rules # ファイルの場合
    networks:
      - test-network
   
  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      # - ./server.cert.pem:/etc/ssl/certs/server.cert.pem
      # - ./server.key.pem:/etc/ssl/private/server.key.pem
      - ./ssl:/etc/nginx/ssl:ro
      # - ./data/certbot/conf:/etc/letsencrypt
      # - ./data/certbot/www:/var/www/certbot
    networks:
      - test-network
    env_file:
      - .env
  # command: /bin/sh -c "while ! curl --silent --fail http://certbot:80/.well-known/acme-challenge/health-check; do echo 'Waiting for certbot to issue certificate...'; sleep 5; done; nginx -g 'daemon off;'"

  # certbot:
  #   image: certbot/certbot
  #   container_name: certbot
  #   volumes:
  #     - ./data/certbot/conf:/etc/letsencrypt
  #     - ./data/certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; certbot certonly --standalone --agree-tos --no-eff-email --email vasto.mar3xc@gmail.com -d offsetcodecraft.com; sleep 12h & wait $${!};'"
  #   restart: unless-stopped

  # certbot_renew:
  # image: certbot/certbot
  # container_name: certbot_renew
  # volumes:
  #   - ./data/certbot/conf:/etc/letsencrypt
  #   - ./data/certbot/www:/var/www/certbot
  # entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  # restart: unless-stopped

  ngrok:
    image: ngrok/ngrok
    command: http app:3000
    depends_on:
      - app
    environment:
      NGROK_AUTH_TOKEN: ${NGROK_AUTH_TOKEN} # Ngrokのトークン
    ports:
      - "4040:4040" # Ngrokの管理インターフェイス
    network_mode: bridge

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.0-jammy   
    depends_on:
      app:
        condition: service_healthy
    networks:
      - test-network
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - NGROK_URL=${NGROK_URL} 
    command: npx playwright test

networks:
  test-network:
    driver: bridge
