services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    ports:
      - "3000:3000" # Reactアプリのポート
    networks:
      - test-network
    volumes:
      - .:/app
      - /app/node_modules # 監視対象から除外
      - /app/dist # 監視対象から除外
      - ./server.key.pem:/etc/ssl/private/server.key.pem
      - ./server.cert.pem:/etc/ssl/certs/server.cert.pem
    env_file:
      - .env
    entrypoint: ./entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -k -v https://localhost:3000 || exit 1"]
      interval: 90s
      timeout: 60s
      retries: 5
      start_period: 600s
    environment:
      VITE_NODE_ENV: ${VITE_NODE_ENV}
      VITE_REACT_APP_API_URL: ${VITE_REACT_APP_API_URL}
      VITE_HTTPS: "true"
      command: vite --https
      VITE_HOST: 0.0.0.0

  firebase:
    build:
      context: .
      dockerfile: ./firebase/Dockerfile
    env_file:
      - .env
    environment:
      VITE_GOOGLE_APPLICATION_CREDENTIALS: "/firebase/serviceAccountKey.json"
    ports:
      - "8080:8080"
      - "5001:5001"
      - "5000:5000"
      - "8090:8090"
      - "9199:9199"
      - "8091:8091"
      - "8085:8085"
    entrypoint: ["/bin/bash", "/firebase/entrypoint.sh"]
    command: firebase emulators:start --only firestore,functions,auth,storage
    volumes:
      - ./storage.rules:/firebase/storage.rules # ファイルの場合

  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./server.cert.pem:/etc/ssl/certs/server.cert.pem
      - ./server.key.pem:/etc/ssl/private/server.key.pem
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - test-network
    env_file:
      - .env

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.0-jammy   
    depends_on:
      app:
        condition: service_healthy
    networks:
      - test-network
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: npx playwright test

# networks:
#   test-network:
#     driver: bridge
networks:
  default:
    driver: bridge
