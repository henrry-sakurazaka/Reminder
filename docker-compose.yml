  playwright:
    container_name: reminder-playwright-1
    image: mcr.microsoft.com/playwright:v1.49.0-jammy   
    depends_on:
      app2:
        condition: service_healthy
      cloudflared:
        condition: service_healthy
    networks:
      - test-network2
    working_dir: /app2
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - VITE_REACT_APP_API_URL=${VITE_REACT_APP_API_URL}
    volumes:
      - ./tests:/app2/tests
      - ./package.json:/app2/package.json
      - ./node_modules:/app2/node_modules
    command: npx playwright test
            
networks:
  test-network2:
    name: reminder_test-network2
    # external: true
    driver: bridge

    


